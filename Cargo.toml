[package]
name = "betterbase-inference"
version = "0.1.0"
edition = "2021"
description = "Authenticated E2EE inference proxy for the Betterbase platform"
license = "Apache-2.0"
authors = ["Betterbase <hello@betterbase.dev>"]
repository = "https://github.com/BetterbaseHQ/betterbase-inference"

[dependencies]
# HTTP framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# JWT
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }

# P-256 / ECDSA
p256 = { version = "0.14", features = ["pkcs8", "getrandom"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# HMAC for rate limit keys
hmac = "0.13"
sha2 = "0.11"

# Errors
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hex decode
hex = "0.4"


# URL building
url = "2"


futures-util = { version = "0.3", features = ["io"] }

# Base64 for JWK coordinates
base64 = "0.23"

# Byte streams
bytes = "1"
http-body-util = "0.1"
http = "1"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
